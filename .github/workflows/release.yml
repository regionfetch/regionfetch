name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        required: true
        type: choice
        options: [regionfetch, regionfetch-mcp, both]

permissions:
  contents: read
  # Required for npm provenance attestations.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1 for OIDC.
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      # The SDK publishes first: regionfetch-mcp depends on it.
      # No NODE_AUTH_TOKEN. Authentication is npm trusted publishing (OIDC):
      # the id-token permission above lets npm exchange a short-lived GitHub
      # token for publish rights, and provenance is attached automatically.
      #
      # Requires a Trusted Publisher configured for EACH package at
      # npmjs.com > package > Settings > Trusted Publisher, pointing at this
      # repository and release.yml. That can only be set up after a package
      # exists, so the first version of each is published manually.
      - name: Publish regionfetch
        if: inputs.package != 'regionfetch-mcp'
        run: npm publish --workspace regionfetch

      # Published second: regionfetch-mcp depends on regionfetch.
      - name: Publish regionfetch-mcp
        if: inputs.package != 'regionfetch'
        run: npm publish --workspace regionfetch-mcp
